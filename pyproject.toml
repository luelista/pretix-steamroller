[project]
name = "pretix-steamroller"
version = "0.0.1"
dependencies = [
    "ruamel.yaml>=0.18.0",
    "BeautifulSoup4>=4.12.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
pretix-steamroll = "steamroller.steamroll:wrapped_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["steamroller"]
namespaces = false
